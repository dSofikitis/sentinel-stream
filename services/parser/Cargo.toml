[package]
name = "sentinel-parser"
version = "0.2.0"
edition = "2021"
description = "SentinelStream parser/enricher service."
license = "MIT"

[lib]
name = "sentinel_parser"
path = "src/lib.rs"

[[bin]]
name = "sentinel-parser"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
