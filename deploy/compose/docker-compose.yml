services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: ss-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "9092:9092"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-init:
    image: redpandadata/redpanda:latest
    container_name: ss-redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        rpk topic create events.raw --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create events.enriched --brokers redpanda:9092 --partitions 3 --replicas 1 || true
        rpk topic create alerts --brokers redpanda:9092 --partitions 3 --replicas 1 || true
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ss-clickhouse
    environment:
      CLICKHOUSE_DB: sentinel
      CLICKHOUSE_USER: sentinel
      CLICKHOUSE_PASSWORD: sentinel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  ingest:
    build:
      context: ../../services/ingest
    image: sentinel-stream/ingest:dev
    container_name: ss-ingest
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    environment:
      INGEST_ADDR: ":8080"
      INGEST_NODE_ID: ingest-1
    ports:
      - "8080:8080"

  generator:
    build:
      context: ../../services/generator
    image: sentinel-stream/generator:dev
    profiles: ["tools"]
    depends_on:
      ingest:
        condition: service_started
    environment:
      INGEST_URL: http://ingest:8080/events

  grafana:
    image: grafana/grafana:11.2.0
    container_name: ss-grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../dashboards:/var/lib/grafana/dashboards:ro

volumes:
  redpanda_data:
  clickhouse_data:
  grafana_data:
